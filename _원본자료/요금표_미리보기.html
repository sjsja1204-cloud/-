<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>요금표 미리보기</title><style>body{margin:24px 16px;background:#fff}
.pt-wrap { --pt-accent: #f26a21; --pt-line: #e5e5e5; --pt-head: #f8f8f8; max-width: 1000px; margin: 0 auto; font-family: "Pretendard", "Noto Sans KR", sans-serif; color: #222; }
.pt-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.pt-tab { padding: 10px 18px; border: 1px solid var(--pt-line); border-radius: 999px; background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.pt-tab.active { background: var(--pt-accent); border-color: var(--pt-accent); color: #fff; }
.pt-section { margin-bottom: 44px; }
.pt-title { border-left: 4px solid var(--pt-accent); padding-left: 10px; font-size: 20px; font-weight: 700; margin: 0 0 8px; }
.pt-desc { color: #555; font-size: 14px; margin: 0 0 16px; }
.pt-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.pt-table { width: 100%; min-width: 480px; border-collapse: collapse; border-top: 2px solid #333; font-size: 14px; text-align: center; }
.pt-table th { background: var(--pt-head); font-weight: 700; padding: 14px 10px; border-bottom: 1px solid var(--pt-line); }
.pt-table td { padding: 13px 10px; border-bottom: 1px solid var(--pt-line); }
.pt-rowhead { font-weight: 600; background: #fcfcfc; }
.pt-best { color: var(--pt-accent); font-weight: 700; }
.pt-note { font-size: 13px; color: #777; margin: 8px 0 0; }
.pt-boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0; }
.pt-box { border: 1px solid var(--pt-line); border-radius: 10px; padding: 16px 18px; background: #fafafa; }
.pt-box h4 { margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid #ddd; font-size: 15px; }
.pt-box dl { margin: 0; }
.pt-box-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; }
.pt-box-row dd { margin: 0; color: var(--pt-accent); font-weight: 700; text-align: right; }
.pt-box ul { margin: 0; padding-left: 16px; font-size: 13px; color: #555; line-height: 1.7; }
