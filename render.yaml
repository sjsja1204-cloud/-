# Render Blueprint — 백엔드 API (server/)
services:
  - type: web
    name: damaganet-api
    runtime: node
    region: singapore
    # 테스트 배포: free 플랜 (15분 무응답 시 잠들어 첫 요청이 30초~1분 느림)
    # 운영 전환 시: plan: starter, preDeployCommand: npm run migrate, startCommand: npm start
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false # 예: https://pub-xxxx.r2.dev 또는 https://img.도메인
      - key: CLIENT_ORIGIN
        sync: false # 예: https://damaganet.pages.dev,https://www.도메인
      - key: TRUST_PROXY
        value: "2" # Cloudflare Pages Functions 프록시 + Render
      - key: COOKIE_SAMESITE
        value: lax
